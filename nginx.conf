user bot helper;

worker_processes 1;

events{}

http{
    upstream backend{
        server 10.0.0.22:8000;
    }

    upstream key_auth{
        server 10.0.0.25:8080;
    }

    server{
        listen 80;
        client_max_body_size 100m;
        underscores_in_headers on;

        location = /health{
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location = /auth_server_health{
            access_log off;
            add_header Content-Type text/plain;
            proxy_pass http://key_auth/get/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_request_buffering off;
        }

        location = /auth_server_store_key{
            add_header Content-Type text/plain;
            proxy_pass http://key_auth/post/store-pu-key;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_request_buffering off;
        }

        location = /auth_server_validate_sign{
            add_header Content-Type text/plain;
            proxy_pass http://key_auth/get/auth-pu-key;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_request_buffering off;
        }

        location /{
            # return 200 "Hello from nginx\n";
            add_header Content-Type text/plain;
            proxy_pass http://backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_request_buffering off;

            # return 200 "request redirected to 10.0.0.22:8000"; # never use proxy pass with return otherwise proxy pass will not execute
        }
    }
}