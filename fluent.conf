# it will provide a http endpoint to accept http packets. it will use http at application layer and tcp at transport layer
<source> 
    @type http
    port 9880
    bind 0.0.0.0
</source>

# it will provide a tcp endpoint to accept tcp packets. it will use fluentd forward protocol at application layer and tcp(logs) and udp(heartbeat/health check) at transport layer
<source> 
    @type forward
    port 24224
    bind 0.0.0.0
</source>

# it will monitor health and status of fluentd server. it will use http at application layer and tcp at transport layer
<source>
    @type monitor_agent
    port 24220
    bind 0.0.0.0
</source>

# match will decide where to send and store log.
# adding tag in match. it will collect log with maching tag only
<match api.server>
    @type file
    path /fluentd/log/api/api.server.*.log
</match>

<match db.server>
    @type file
    path /fluentd/log/db/db.server.*.log
</match>

<match nginx.server>
    @type file
    path /fluentd/log/nginx/nginx.server.*.log
</match>